
name: UFC3 Linux configure test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: ufc3-generated-code
          path: generated/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38286640054

      - name: Check generated files
        run: |
          echo "Checking ReXGlue CMake file..."
          test -f generated/rexglue.cmake
          echo "ReXGlue CMake file found"
          echo "Generated file count:"
          find generated -type f | wc -l

      - name: Check existing tools
        run: |
          cmake --version
          ninja --version
          clang++ --version

