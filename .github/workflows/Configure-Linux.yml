
name: UFC3 Linux configure test

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-20 libgtk-3-dev

      - name: Check generated files
        run: |
          test -f generated/rexglue.cmake
          echo "ReXGlue CMake file found"
          ls -lah generated

      - name: Check compiler
        run: |
          clang-20 --version
          cmake --version
          ninja --version
