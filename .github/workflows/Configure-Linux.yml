
name: UFC3 Linux configure test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

        
      - name: Checkout private game assets
        uses: actions/checkout@v4
        with:
          repository: databvse/ufc3-private-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: private-assets

      - name: Restore original XEX
        run: |
          mkdir -p assets/game
          cp private-assets/default.xex assets/game/default.xex
          ls -lh assets/game/default.xex


      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: ufc3-generated-code
          path: generated/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38286640054

      - name: Check generated files
        run: |
          echo "Checking ReXGlue CMake file..."
          test -f generated/rexglue.cmake
          echo "ReXGlue CMake file found"
          echo "Generated file count:"
          find generated -type f | wc -l

      - name: Check existing tools
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Install Clang 20
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20

      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev


      - name: Build and install ReXGlue SDK
        run: |
          git clone --recursive https://github.com/rexglue/rexglue-sdk.git
          cd rexglue-sdk
          cmake --preset linux-amd64 \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DSDL_X11_XSCRNSAVER=OFF
 
      - name: Configure UFC3
        run: |
          cmake --preset linux-amd64-relwithdebinfo \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/rexglue-sdk" \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DSDL_X11_XSCRNSAVER=OFF


      - name: Inspect missing headers
        run: |
          echo "Searching for imgui.h..."
          find rexglue-sdk -name imgui.h -print
          echo "Searching for native_guest_renderer.h..."
          find rexglue-sdk -name native_guest_renderer.h -print

      - name: Build UFC3
        run: |
          cmake --build out/build/linux-amd64-relwithdebinfo --target ufc3 -j2




