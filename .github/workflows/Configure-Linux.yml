
name: UFC3 Linux configure test

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check generated files
        run: |
          echo "Checking ReXGlue CMake file..."
          if [ -f generated/rexglue.cmake ]; then
            echo "ReXGlue CMake file found"
          else
            echo "ReXGlue CMake file missing"
            exit 1
          fi

      - name: Check existing tools
        run: |
          cmake --version
          ninja --version
          clang++ --version
