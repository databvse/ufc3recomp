
name: UFC3 Linux configure test

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: ufc3-generated-code
          path: generated/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Check generated files
        run: |
          echo "Checking ReXGlue CMake file..."
          test -f generated/rexglue.cmake
          echo "ReXGlue CMake file found"
          find generated -maxdepth 2 -type f | head -30

      - name: Check existing tools
        run: |
          cmake --version
          ninja --version
          clang++ --version

